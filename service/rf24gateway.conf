# RF24Gateway service settings. Restart after editing:
#   sudo systemctl restart rf24gateway

# Radio wiring: CE GPIO pin, and CSN as the spidev number (0 = /dev/spidev0.0)
ce_pin = 22
csn = 0
# IRQ GPIO pin, used only by the ncursesint (GUI with interrupts) mode
irq_pin = 24

# 0 = mesh master. Any other value runs the gateway as a child node
node_id = 0

# Must match every node on this network
channel = 97
# 250k, 1m or 2m
data_rate = 1m

# Address of the tun_nrf24 interface
ip = 10.10.2.2
netmask = 255.255.255.0

# Master gateway only: the nodeIDs allowed on the mesh, separated by commas or spaces. Any other node
# has its address released, so it can't send or receive TCP/IP traffic through the gateway. Empty or
# commented out: any node may join. NodeIDs aren't authenticated, so also see encryption below and
# docs/securing_the_network.md
#allowed_nodes = 2, 3, 4

# How often a child gateway checks its mesh connection
check_interval_ms = 30000

# Headless mode only: 1 = forward non-IP RF24Network messages to UDP clients (examples/clients)
forward_user_data = 1

# AES-CCM encryption, compatible with nRF52/nRF54 nodes using nrf_to_nrf encryption.
# Needs the service built with -DRF24NETWORK_CCM=ON (install.sh asks). Every node must use the same
# key, so nodes without encryption (e.g. Arduino + nRF24L01) can't talk to an encrypting gateway.
# Encrypted frames carry 12 bytes less data, so throughput is lower
encryption = 0
# 16 byte key as 32 hex digits or a C array (0x01, 0x02, ...). Keep it readable only by root and
# the service user: sudo chown root:rf24gateway <file> && sudo chmod 640 <file>
encryption_key_file = /etc/rf24gateway/rf24gateway.key
